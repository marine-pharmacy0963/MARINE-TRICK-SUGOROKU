<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MARINE SUGOROKU</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.42);z-index:-1}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.94);border:2px solid #9bd6f4;border-radius:20px;padding:18px;margin:12px 0;backdrop-filter:blur(6px)}h1{color:#0878bd;margin-bottom:8px}button{border:0;border-radius:11px;padding:11px 14px;margin:5px;background:#1686c9;color:white;font-weight:800;cursor:pointer}.muted{color:#567;font-size:12px}.choice{display:block;width:100%;text-align:left}.good{background:#278a62}.bad{background:#b94b4b}.img{max-width:100%;max-height:300px;object-fit:contain;border-radius:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}.hidden{display:none!important} .board{display:flex;gap:8px;flex-wrap:wrap}.sq{width:88px;min-height:88px;border:2px solid #9bd6f4;border-radius:14px;padding:7px;background:#fff}.here{outline:4px solid #1686c9}.sq img{width:100%;height:42px;object-fit:contain}</style></head><body><div class="wrap"><div class="card"><h1 id="title"></h1><p id="desc"></p><div id="boardimg"></div></div><div class="card"><div id="board" class="board"></div></div><div class="card"><h2 id="pos"></h2><p id="event"></p><button id="dice">サイコロを振る</button><button id="reset">最初から</button><span id="saved" class="muted"></span></div></div><script>
(function(){
 const THEMEKEY="marine_theme_cache_v1";
 function find(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
 function apply(t){let im=find(t);if(im)document.body.style.backgroundImage='url("'+im.replace(/"/g,"%22")+'")'}
 fetch("marine-theme.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(t=>{try{localStorage.setItem(THEMEKEY,JSON.stringify(t))}catch(e){};apply(t)}).catch(()=>{try{let s=localStorage.getItem(THEMEKEY);if(s)apply(JSON.parse(s))}catch(e){}})
})();</script><script>
const DATA={"schema":"marine-sugoroku-master-v1","updated":"2026-09-04T00:35:31.589Z","title":"MARINE SUGOROKU","players":"1〜4人","desc":"","boardImage":"","spaces":[]},SAVE="marine_sugoroku_public_save_v1";const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let p=0,turn=0;
function load(){try{let z=JSON.parse(localStorage.getItem(SAVE)||"null");if(z){p=z.p||0;turn=z.turn||0}}catch(e){}}
function save(){localStorage.setItem(SAVE,JSON.stringify({p,turn}));$("saved").textContent="進行状況を保存済み"}
function draw(){ $("title").textContent=DATA.title||"MARINE SUGOROKU";$("desc").textContent=DATA.desc||"";$("boardimg").innerHTML=DATA.boardImage?'<img class="img" src="'+DATA.boardImage+'">':"";
$("board").innerHTML=DATA.spaces.map((s,i)=>'<div class="sq '+(i==p?"here":"")+'">'+(s.image?'<img src="'+s.image+'">':"")+'<b>'+(i+1)+'</b><br>'+E(s.label||s.type)+'</div>').join("");$("pos").textContent=DATA.spaces.length?"現在 "+(p+1)+"マス目":"マスが登録されていません"}
function land(){let s=DATA.spaces[p];if(!s)return;$("event").textContent=s.text||s.type||"";if(s.type==="進む"||s.type==="戻る"){let m=Number(s.move)||0;p=Math.max(0,Math.min(DATA.spaces.length-1,p+m));$("event").textContent+=(m>=0?" ＋":" ")+m+"マス";}if(s.type==="ゴール")$("dice").disabled=true;save();draw()}
$("dice").onclick=()=>{if(!DATA.spaces.length)return;let n=1+Math.floor(Math.random()*6);turn++;p=Math.min(DATA.spaces.length-1,p+n);$("event").textContent=n+" が出た！";draw();setTimeout(land,250)};$("reset").onclick=()=>{if(confirm("最初から始めますか？")){p=0;turn=0;$("dice").disabled=false;localStorage.removeItem(SAVE);$("event").textContent="";draw();save()}};load();draw();
</script></body></html>
