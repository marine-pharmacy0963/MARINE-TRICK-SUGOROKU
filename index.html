<script>const CFG={"version":"1.0","password":"3103","updatedAt":"","allowSave":false,"image":{"max":1024,"quality":0.82},"background":"","goalShells":15,"eventWeights":{"shell1":12,"shell3":12,"lose2":10,"steal2":8,"forward3":10,"back3":8,"rest":7,"reroll":8,"allShell2":7,"warp":10,"nothing":8},"destinations":[{"name":"目的地1","emoji":"🐚","icon":"","arrival":""},{"name":"目的地2","emoji":"🐠","icon":"","arrival":""},{"name":"目的地3","emoji":"🪸","icon":"","arrival":""},{"name":"目的地4","emoji":"🐙","icon":"","arrival":""},{"name":"目的地5","emoji":"🐬","icon":"","arrival":""},{"name":"目的地6","emoji":"🦀","icon":"","arrival":""},{"name":"目的地7","emoji":"🐳","icon":"","arrival":""},{"name":"目的地8","emoji":"🦑","icon":"","arrival":""},{"name":"目的地9","emoji":"🏝️","icon":"","arrival":""}],"tiles":{"normal":"","shell1":"","shell2":"","shell3":"","forward":"","back":"","rest":"","event":""},"icons":[{"name":"アイコン1","emoji":"🐟","image":""},{"name":"アイコン2","emoji":"🐙","image":""},{"name":"アイコン3","emoji":"🐬","image":""},{"name":"アイコン4","emoji":"🦀","image":""},{"name":"アイコン5","emoji":"🐳","image":""},{"name":"アイコン6","emoji":"🐡","image":""},{"name":"アイコン7","emoji":"🦑","image":""},{"name":"アイコン8","emoji":"🦈","image":""}]};</script><script>
"use strict";(()=>{const $=id=>document.getElementById(id),R=7,C=13,T={normal:"",shell1:"🐚",shell2:"🐚2",shell3:"🐚3",forward:"⏩",back:"⏪",rest:"💤",event:"✨"},D=[[-1,0],[1,0],[0,-1],[0,1]];let S={maps:1,nodes:{},edges:[],dests:[],players:[],turn:0,round:1,goal:1,remaining:0,prev:null,moving:false,moveMode:"normal",forcedMove:false,phase:"idle"};
const k=(m,r,c)=>m+":"+r+":"+c,pk=x=>{let a=x.split(":").map(Number);return{m:a[0],r:a[1],c:a[2]}},eid=(a,b)=>[a,b].sort().join("|");
function node(m,r,c,t="normal"){let x=k(m,r,c);if(!S.nodes[x])S.nodes[x]={id:x,m,r,c,type:t};return x}function edge(a,b){let e=eid(a,b);if(a!==b&&!S.edges.includes(e))S.edges.push(e)}function nb(x){let z=[];for(let e of S.edges){let[a,b]=e.split("|");if(a===x)z.push(b);else if(b===x)z.push(a)}return z}
function path(a,b){if(!a||!b)return null;let q=[a],p={[a]:null};for(let i=0;i<q.length;i++){let x=q[i];if(x===b){let z=[];while(x){z.push(x);x=p[x]}return z.reverse()}for(let y of nb(x))if(!(y in p)){p[y]=x;q.push(y)}}return null}
function carve(a,b){let A=pk(a),B=pk(b),cur=a,guard=0;while(cur!==b&&guard++<400){let X=pk(cur),opts=[];if(X.r<B.r)opts.push([1,0]);if(X.r>B.r)opts.push([-1,0]);if(X.c<B.c)opts.push([0,1]);if(X.c>B.c)opts.push([0,-1]);let z=opts[Math.floor(Math.random()*opts.length)],nr=X.r+z[0],nc=X.c+z[1],nm=X.m;if(nr>=R){nm++;nr=0}if(nr<0){nm--;nr=R-1}if(nm<0||nm>=S.maps)continue;let y=node(nm,nr,nc);edge(cur,y);cur=y}}
function gen(){S.maps=+$("length").value;S.nodes={};S.edges=[];S.dests=[];
 for(let m=0;m<S.maps;m++){
  let row=3,a=node(m,row,0,"destination"),b=node(m,row,6,"destination"),c=node(m,row,12,"destination");
  S.dests.push({id:m*3+1,node:a},{id:m*3+2,node:b},{id:m*3+3,node:c});
  for(let col=0;col<12;col++)edge(node(m,row,col),node(m,row,col+1));
  for(let rr=0;rr<6;rr++)edge(node(m,rr,6),node(m,rr+1,6));
  if(m<S.maps-1)edge(node(m,6,6),node(m+1,0,6));
 }
 let budget=S.maps*42;
 for(let i=0;i<budget;i++){let keys=Object.keys(S.nodes),cur=keys[Math.floor(Math.random()*keys.length)],steps=1+Math.floor(Math.random()*4);for(let q=0;q<steps;q++){let X=pk(cur),opts=D.slice().sort(()=>Math.random()-.5),made=false;for(let z of opts){let nr=X.r+z[0],nc=X.c+z[1];if(nr<0||nr>=R||nc<0||nc>=C)continue;let y=k(X.m,nr,nc);if(!S.nodes[y]){node(X.m,nr,nc);edge(cur,y);cur=y;made=true;break}}if(!made)break}}
 let types=["normal","normal","shell1","shell1","shell2","shell3","forward","back","rest","event"];for(let n of Object.values(S.nodes))if(n.type!=="destination")n.type=types[Math.floor(Math.random()*types.length)];}
function goalNode(){return S.dests.find(d=>d.id===S.goal)?.node}function visual(n){if(n.type==="destination"){let id=S.dests.find(d=>d.node===n.id)?.id,d=CFG.destinations[id-1];return d.icon?'<img src="'+d.icon+'">':d.emoji}let im=CFG.tiles[n.type];return im?'<img src="'+im+'">':(T[n.type]||"")}
function renderMap(el,mode,mapOnly=null){el.innerHTML="";for(let m=0;m<S.maps;m++){if(mapOnly!==null&&m!==mapOnly)continue;let M=document.createElement("div");M.className="map";for(let r=0;r<R;r++)for(let c=0;c<C;c++){let id=k(m,r,c),n=S.nodes[id],x=document.createElement("div");x.className="cell"+(n?" active":"");x.dataset.node=id;if(n){for(let y of nb(id)){let B=pk(y);if(B.m!==m)continue;if(B.r===r&&B.c===c+1)x.innerHTML+='<i class="road h r"></i>';if(B.r===r&&B.c===c-1)x.innerHTML+='<i class="road h l"></i>';if(B.c===c&&B.r===r+1)x.innerHTML+='<i class="road v d"></i>';if(B.c===c&&B.r===r-1)x.innerHTML+='<i class="road v u"></i>'}x.innerHTML+='<div class="tile">'+visual(n)+'</div>';let did=S.dests.find(d=>d.node===id)?.id;if(did===S.goal)x.innerHTML+='<div class="goalmark">🎯 目的地</div>';if(mode==="game"){let here=S.players.filter(p=>p.pos===id);here.forEach((p,pi)=>{let q=CFG.icons[p.icon]||CFG.icons[0],t=document.createElement("div");t.className="token"+(here.length>4?" cluster":"");let n=here.length,ang=(-Math.PI/2)+(2*Math.PI*pi/n),rad=n<=1?0:n<=4?20:30;t.style.marginLeft=(Math.cos(ang)*rad)+"px";t.style.marginTop=(Math.sin(ang)*rad)+"px";t.innerHTML=q.image?'<img src="'+q.image+'">':q.emoji;x.appendChild(t)})}}M.appendChild(x)}el.appendChild(M)}}

const EVENT_LABELS={shell1:["🐚","貝殻 +1"],shell3:["🐚🐚🐚","貝殻 +3"],lose2:["💥","貝殻 -2"],steal2:["🎁","ランダムな相手から貝殻2個GET"],forward3:["🌊","追加で3マス進む"],back3:["🌀","3マス戻る"],rest:["💤","次回1回休み"],reroll:["🎲","もう一度サイコロ"],allShell2:["🐚✨","全員が貝殻 +2"],warp:["🌀💨","ランダムな道路マスへぶっとぶ"],nothing:["✨","何も起こらなかった"]};
function showHelp(){
 let W=CFG.eventWeights||{},sum=Object.values(W).reduce((a,v)=>a+(+v||0),0)||1;
 let events=Object.entries(EVENT_LABELS).filter(([k])=>(+W[k]||0)>0).map(([k,v])=>'<div class="helpitem"><span class="big">'+v[0]+'</span> '+v[1]+'<div class="prob">約 '+((+W[k]||0)/sum*100).toFixed(1)+'%</div></div>').join("");
 $("helpBody").innerHTML='<h3>👀 画面の見かた</h3><div class="helpgrid"><div class="helpitem"><span class="big">🟡</span><b> 黄色く光るマス</b><br>今回進めるマスです。タップすると1マス進みます。</div><div class="helpitem" style="box-shadow:inset 0 0 0 5px #ff1744"><span class="big">🔴</span><b> 赤枠・赤線</b><br>目的地への最短・ゴールガイドです。サイコロ後は、出目ぴったりでゴールできるルートを最優先で案内します。</div><div class="helpitem"><span class="big">🎯</span><b> 目的地ガイド</b><br>現在めざしている目的地です。ゲーム画面上部の「目的地名・アイコンまで最短○マス」と連動します。</div></div><h3 style="margin-top:18px">🎲 移動ルール</h3><div class="helpitem"><b>出た目はすべて使い切ります。</b><br>残りの出目を最後まで消化できない行き止まり方向は、黄色く光らず選択できません。来た道への折り返しもできません。<br><br>🎯 目的地は<b>最後の1マスでぴったり止まった時だけ到着</b>です。途中で通った場合は通過します。<br><br>🔴 赤いガイドは「出目ぴったりで目的地に着けるルート」を最優先。なければ、出目を使い切ったあと目的地に最も近くなる有効ルートを案内します。CPUも同じルールです。</div><h3>🧭 マスの意味</h3><div class="helpgrid"><div class="helpitem">🐚 貝殻を1個GET</div><div class="helpitem">🐚2 / 🐚3 貝殻を2・3個GET</div><div class="helpitem"><b>⏩ 進む</b><br>目的地に近づく道路だけが黄色く表示されます。分岐では好きな道を選べます。進める道がなくなった場合はそこで終了します。</div><div class="helpitem"><b>⏪ 戻る</b><br>自分が実際に通ってきた道を巻き戻します。戻れる履歴が足りない場合は、戻れるところまで戻って終了します。</div><div class="helpitem">💤 1回休み</div><div class="helpitem">✨ ランダムイベント</div><div class="helpitem">🎯 現在の目的地</div><div class="helpitem">📍 スタート地点</div></div><h3 style="margin-top:18px">✨ イベントで起こること</h3><p class="small">イベントマスでは100%抽選。確率はMASTER設定から自動計算されます。</p><div class="helpgrid">'+events+'</div>';

function popup(html,ms=900){$("popupBox").innerHTML=html;$("popup").classList.add("show");return new Promise(r=>setTimeout(()=>{$("popup").classList.remove("show");r()},ms))}

function canFinishSteps(cur,steps,prev){
 if(steps<=0)return true;
 let opts=nb(cur);if(prev&&opts.length>1)opts=opts.filter(x=>x!==prev);
 for(let nxt of opts){if(nxt===prev)continue;if(canFinishSteps(nxt,steps-1,cur))return true}
 return false;
}
function validNextMoves(){
 let p=S.players[S.turn];if(!p)return[];
 let opts=nb(p.pos);if(S.prev&&opts.length>1)opts=opts.filter(x=>x!==S.prev);
 if(S.remaining<=1)return opts;
 return opts.filter(nxt=>canFinishSteps(nxt,S.remaining-1,p.pos));
}
function bestRollRoute(start,steps,goal,blockedPrev=null){
 let best=null,bestRemain=1e9;
 function dfs(cur,left,prev,route,visitedEdges){
  if(left===0){
   if(cur===goal)return {exact:true,route:route.slice(),remain:0};
   let rem=path(cur,goal),dist=rem?rem.length-1:1e9;
   if(dist<bestRemain){bestRemain=dist;best={exact:false,route:route.slice(),remain:dist}}
   return null;
  }
  let opts=nb(cur);
  if(prev&&opts.length>1)opts=opts.filter(x=>x!==prev);
  if(left>1)opts=opts.filter(nxt=>canFinishSteps(nxt,left-1,cur));
  opts=opts.slice().sort((a,b)=>(path(a,goal)?.length||999)-(path(b,goal)?.length||999));
  for(let nxt of opts){
   let e=eid(cur,nxt),count=visitedEdges[e]||0;
   if(count>=1)continue;
   visitedEdges[e]=count+1;route.push(nxt);
   let hit=dfs(nxt,left-1,cur,route,visitedEdges);
   route.pop();if(count)visitedEdges[e]=count;else delete visitedEdges[e];
   if(hit?.exact)return hit;
  }
  return null;
 }
 let exact=dfs(start,steps,blockedPrev,[start],{});
 return exact||best;
}
function addRouteSeg(nodeId,cls){let e=document.querySelector('#maps .cell[data-node="'+CSS.escape(nodeId)+'"]');if(!e)return;e.classList.add("routecell");let z=document.createElement("i");z.className="route "+cls;e.appendChild(z)}
function routeGuide(){
 document.querySelectorAll("#maps .route").forEach(e=>e.remove());
 document.querySelectorAll("#maps .routecell").forEach(e=>e.classList.remove("routecell"));
 let p=S.players[S.turn];if(!p)return;
 let P=null;
 if(S.phase==="forced"&&S.moveMode==="back"){
   let h=Array.isArray(p.history)?p.history:[p.pos];
   P=[p.pos];
   for(let i=h.length-2;i>=0&&P.length<=S.remaining;i--)P.push(h[i]);
 }else if(S.phase==="moving"&&S.remaining>0){
   P=bestRollRoute(p.pos,S.remaining,goalNode(),S.prev)?.route;
 }else if(S.phase==="forced"&&S.moveMode==="forward"&&S.remaining>0){
   P=[p.pos];let cur=p.pos,prev=S.prev;
   for(let i=0;i<S.remaining;i++){let curDist=path(cur,goalNode())?.length??999,z=nb(cur);if(prev&&z.length>1)z=z.filter(x=>x!==prev);z=z.filter(x=>(path(x,goalNode())?.length??999)<curDist);z.sort((a,b)=>(path(a,goalNode())?.length??999)-(path(b,goalNode())?.length??999));if(!z[0])break;prev=cur;cur=z[0];P.push(cur)}
 }else P=path(p.pos,goalNode());
 if(!P||P.length<2)return;
 for(let i=0;i<P.length-1;i++){let a=pk(P[i]),b=pk(P[i+1]);if(a.m!==b.m)continue;
  if(a.r===b.r&&b.c>a.c){addRouteSeg(P[i],"h r");addRouteSeg(P[i+1],"h l")}
  else if(a.r===b.r&&b.c<a.c){addRouteSeg(P[i],"h l");addRouteSeg(P[i+1],"h r")}
  else if(a.c===b.c&&b.r>a.r){addRouteSeg(P[i],"v d");addRouteSeg(P[i+1],"v u")}
  else if(a.c===b.c&&b.r<a.r){addRouteSeg(P[i],"v u");addRouteSeg(P[i+1],"v d")}
 }
}
function render(){renderMap($("maps"),"game");let p=S.players[S.turn],d=CFG.destinations[S.goal-1],P=p?path(p.pos,goalNode()):null;$("goal").textContent="🎯 いまの目的地："+(d?.name||"-");$("round").textContent="ラウンド "+S.round;$("score").textContent=S.players.map(x=>x.name+" 🐚"+x.shells).join("　");$("turn").textContent=p?(p.cpu?"🤖 "+p.name+" のターン":"🐟 あなたのターン"):"";let gi=d?.icon?'<img src="'+d.icon+'" style="width:38px;height:38px;object-fit:cover;border-radius:10px;vertical-align:middle;margin-right:5px">':'<span style="font-size:30px;vertical-align:middle">'+(d?.emoji||"🎯")+'</span>';$("distance").innerHTML=P?gi+' <b>'+d.name+'</b> まで最短 '+Math.max(0,P.length-1)+'マス':gi+' <b>'+d.name+'</b> まで最短 - マス';let ce=document.querySelector('#maps .cell[data-node="'+CSS.escape(p?.pos||"")+'"]');if(ce)ce.classList.add("current");routeGuide();if((S.phase==="moving"||S.phase==="forced")&&!p?.cpu)setTimeout(highlight,0)}
function normalMoveChoices(){return validNextMoves()}
function forcedMoveChoices(){
 let p=S.players[S.turn];if(!p)return[];
 if(S.moveMode==="back"){
   let h=Array.isArray(p.history)?p.history:[];
   if(h.length<2)return[];
   let prev=h[h.length-2];
   return nb(p.pos).includes(prev)?[prev]:[];
 }
 let g=goalNode(),curDist=path(p.pos,g)?.length??999;
 let z=nb(p.pos);
 if(S.prev&&z.length>1)z=z.filter(x=>x!==S.prev);
 return z.filter(x=>(path(x,g)?.length??999)<curDist);
}
function legal(){return S.forcedMove?forcedMoveChoices():normalMoveChoices()}
function highlight(){document.querySelectorAll(".choice").forEach(x=>x.classList.remove("choice"));for(let y of legal()){let e=document.querySelector('#maps .cell[data-node="'+CSS.escape(y)+'"]');if(e){e.classList.add("choice");e.onclick=()=>S.forcedMove?forcedStep(y):step(y)}}}
function forcedStep(y){
 let p=S.players[S.turn];
 if(S.phase!=="forced"||p.cpu||S.moveMode!=="forward"||!forcedMoveChoices().includes(y))return;
 if(!moveTo(p,y,true))return;
 render();
 if(S.remaining>0){$("guide").textContent="進む：あと "+S.remaining+"マス";highlight();center(false)}
 else finish();
}
async function roll(){let p=S.players[S.turn];if(S.phase!=="idle"||S.moving)return;S.phase="rolling";if(p.skip){p.skip--;await popup("💤 "+p.name+"<br>1回休み",850);S.phase="idle";return next()}let ic=CFG.icons[p.icon]||CFG.icons[0],pv=ic.image?'<img src="'+ic.image+'">':ic.emoji;$("popupBox").innerHTML='<span class="popplayer">'+pv+'</span><b>'+p.name+'</b><span class="rollingdie">🎲</span><div>サイコロを転がしています…</div>';$("popup").classList.add("show");await new Promise(r=>setTimeout(r,850));let n=1+Math.floor(Math.random()*6);$("popupBox").innerHTML='<span class="popplayer">'+pv+'</span><b>'+p.name+'</b><span class="dicebig">'+["⚀","⚁","⚂","⚃","⚄","⚅"][n-1]+'</span><div>出た目は <b style="font-size:38px">'+n+'</b>！</div>';await new Promise(r=>setTimeout(r,850));$("popup").classList.remove("show");beginMovement(n,"normal",false);let plan=bestRollRoute(p.pos,n,goalNode(),null);$("guide").textContent=plan?.exact?"🎯 "+n+"マスちょうどで目的地に着けるルートを赤線表示！":n+"マス進みます。"+(p.cpu?"":"赤線を参考に光ったマスをタップ！");if(p.cpu)cpuStep();else{render();highlight()}}
function moveTo(p,next,record=true){
 if(!next||!S.nodes[next]||!nb(p.pos).includes(next))return false;
 S.prev=p.pos;p.pos=next;
 if(record){if(!Array.isArray(p.history))p.history=[S.prev];p.history.push(next)}
 S.remaining=Math.max(0,S.remaining-1);
 return true;
}
function step(y){
 let p=S.players[S.turn];
 if(S.phase!=="moving"||p.cpu||!normalMoveChoices().includes(y))return;
 if(!moveTo(p,y,true))return;
 render();
 if(S.remaining>0){$("guide").textContent="あと "+S.remaining+"マス";highlight();center(false)}
 else finish();
}
async function cpuStep(){
 let p=S.players[S.turn];if(!S.moving||!p.cpu)return;
 if(S.remaining<=0)return finish();
 let z=legal(),next=null;
 if(S.forcedMove){
   if(S.moveMode==="forward"){let g=goalNode();z.sort((a,b)=>(path(a,g)?.length??999)-(path(b,g)?.length??999))}
   next=z[0];
 }else{
   let plan=bestRollRoute(p.pos,S.remaining,goalNode(),S.prev);
   next=plan?.route?.[1]||z[0];
 }
 if(!next){S.remaining=0;return finish()}
 if(S.moveMode==="back"){
   if(!moveTo(p,next,false)){S.remaining=0;return finish()}
   if(Array.isArray(p.history)&&p.history.length>1)p.history.pop();
 }else{
   if(!moveTo(p,next,true)){S.remaining=0;return finish()}
 }
 render();center(true);
 if(S.remaining<=0)return setTimeout(()=>finish(),220);
 setTimeout(cpuStep,320);
}
function beginMovement(steps,mode,forced){S.remaining=steps;S.prev=null;S.moving=true;S.moveMode=mode;S.forcedMove=forced;S.phase=forced?"forced":"moving"}
async function startForcedMove(p,steps,mode){
 beginMovement(steps,mode,true);
 await popup(p.name+"<br>"+(mode==="back"?"⏪ "+steps+"マス戻る！":"⏩ "+steps+"マス進む！"),700);
 if(mode==="back"){
   while(S.remaining>0){
     let z=forcedMoveChoices(),next=z[0];
     if(!next)break;
     if(!moveTo(p,next,false))break;
     if(Array.isArray(p.history)&&p.history.length>1)p.history.pop();
     render();center(true);
     await new Promise(r=>setTimeout(r,260));
   }
   S.remaining=0;
   return finish();
 }
 if(p.cpu)return cpuStep();
 render();highlight();
 $("guide").textContent="進む：あと "+S.remaining+"マス。目的地方向の黄色いマスをタップ！";
 return "continue";
}
async function runEvent(p){
 let W=CFG.eventWeights||{nothing:1},entries=Object.entries(W).filter(x=>+x[1]>0),sum=entries.reduce((a,x)=>a+(+x[1]),0);if(!sum){entries=[["nothing",1]];sum=1}
 let r=Math.random()*sum,key="nothing";for(let [k,w] of entries){r-=+w;if(r<=0){key=k;break}}
 if(key==="shell1"){p.shells+=1;await popup(p.name+"<br>✨ イベント！<br>🐚 貝殻 +1",1000)}
 else if(key==="shell3"){p.shells+=3;await popup(p.name+"<br>✨ イベント！<br>🐚 貝殻 +3！",1000)}
 else if(key==="lose2"){let n=Math.min(2,p.shells);p.shells-=n;await popup(p.name+"<br>✨ イベント！<br>💥 貝殻 -"+n,1000)}
 else if(key==="steal2"){let others=S.players.filter(x=>x!==p&&x.shells>0);if(others.length){let v=others[Math.floor(Math.random()*others.length)],n=Math.min(2,v.shells);v.shells-=n;p.shells+=n;await popup(p.name+"<br>✨ イベント！<br>🎁 "+v.name+"から貝殻"+n+"個GET！",1200)}else await popup(p.name+"<br>✨ イベント！<br>🎁 もらえる貝殻がなかった！",1000)}
 else if(key==="rest"){p.skip=1;await popup(p.name+"<br>✨ イベント！<br>💤 次回1回休み",1000)}
 else if(key==="forward3"){await popup(p.name+"<br>✨ イベント！<br>🌊 追加で3マス進む！",800);return await startForcedMove(p,3,"forward")}
 else if(key==="back3"){await popup(p.name+"<br>✨ イベント！<br>🌀 3マス戻る！",800);return await startForcedMove(p,3,"back")}
 else if(key==="reroll"){await popup(p.name+"<br>✨ イベント！<br>🎲 もう一度サイコロ！",900);S.moving=false;S.remaining=0;S.prev=null;S.forcedMove=false;S.moveMode="normal";S.phase="idle";setTimeout(roll,250);return "continue"}
 else if(key==="allShell2"){S.players.forEach(x=>x.shells+=2);await popup("✨ イベント！<br>🐚 全員に貝殻 +2！",1100)}
 else if(key==="warp"){let spots=Object.values(S.nodes).filter(n=>n.type!=="destination"&&n.id!==p.pos);if(spots.length){let w=spots[Math.floor(Math.random()*spots.length)];await popup(p.name+"<br>✨ イベント！<br>🌀 どこかへぶっとぶ！！",900);p.pos=w.id;render();center(true);await popup("🌀 "+p.name+" 着地！",800)}}
 else await popup(p.name+"<br>✨ イベント！<br>何も起こらなかった！",1000);
}
async function finish(){let p=S.players[S.turn],n=S.nodes[p.pos],msg="",wasForced=S.forcedMove;S.moving=false;S.prev=null;S.moveMode="normal";S.forcedMove=false;S.remaining=0;S.phase="idle";
 if(n.type==="shell1"){p.shells++;msg="🐚 貝殻を1個GET！"}if(n.type==="shell2"){p.shells+=2;msg="🐚 貝殻を2個GET！"}if(n.type==="shell3"){p.shells+=3;msg="🐚 貝殻を3個GET！"}if(n.type==="rest"){p.skip=1;msg="💤 次のターンは1回休み"}

 if(!wasForced&&n.type==="forward"){let res=await startForcedMove(p,2,"forward");if(res==="continue")return}

 if(p.pos===goalNode()){let d=CFG.destinations[S.goal-1],reward=CFG.goalShells??15;p.shells+=reward;await popup("🎉 "+p.name+" 到着！<br>"+d.name+"<br>🐚 貝殻 +"+reward,1300);let old=S.goal,opts=S.dests.filter(d=>d.id!==old);S.goal=opts[Math.floor(Math.random()*opts.length)].id;let nd=CFG.destinations[S.goal-1],pic=nd.arrival||nd.icon||"";await popup((pic?'<img src="'+pic+'" style="width:min(240px,65vw);max-height:180px;object-fit:contain;border-radius:18px;display:block;margin:0 auto 10px">':'<span class="dicebig">'+nd.emoji+'</span>')+'🎯 次の目的地<br><b>'+nd.name+'</b>',1500)}
 next()}
function next(){S.players.forEach(p=>{if(!Array.isArray(p.history)||!p.history.length)p.history=[p.pos]});S.moving=false;S.remaining=0;S.prev=null;S.forcedMove=false;S.moveMode="normal";S.phase="idle";S.turn=(S.turn+1)%S.players.length;if(S.turn===0)S.round++;$("guide").textContent="";render();localStorage.setItem("marineSugorokuGame",JSON.stringify(S));setTimeout(()=>center(true),180);if(S.players[S.turn]?.cpu)setTimeout(roll,700)}

let chosenIcons=[];
function rebuildPlayerSelectors(){
 const humanSel=$("humans"),cpuSel=$("cpus"),grid=$("iconChoiceGrid");
 let humans=Math.max(1,Math.min(8,Number(humanSel.value)||1));

async function startNewGame(){
 const humans=Number($("humans").value),cpus=Number($("cpus").value),total=humans+cpus;
 if(!Number.isInteger(humans)||humans<1||!Number.isInteger(cpus)||cpus<0||total<1||total>8){alert("操作プレイヤー＋CPUは合計8人までです");return}
 $("start").disabled=true;$("start").textContent="🌊 コース生成中…";
 try{
   S.maps=Number($("length").value)||1;S.nodes={};S.edges=[];S.dests=[];S.players=[];S.turn=0;S.round=1;S.goal=1;S.remaining=0;S.prev=null;S.moving=false;S.moveMode="normal";S.forcedMove=false;S.phase="idle";
   gen();
   if(!validate())throw new Error("生成した道路が目的地まで接続されていません");
   let startPos=node(0,6,6,"normal");
   if(nb(startPos).length===0){
     let sp=pk(startPos),candidates=Object.values(S.nodes).filter(n=>n.m===0&&n.id!==startPos&&nb(n.id).length>0);
     candidates.sort((x,y)=>(Math.abs(x.r-sp.r)+Math.abs(x.c-sp.c))-(Math.abs(y.r-sp.r)+Math.abs(y.c-sp.c)));
     if(!candidates.length)throw new Error("スタート地点を道路へ接続できません");
     let target=candidates[0],cur=startPos;
     while(cur!==target.id){let q=pk(cur),dr=Math.sign(target.r-q.r),dc=Math.sign(target.c-q.c),nr=q.r+(dr||0),nc=q.c+(dr?0:dc),next=node(0,nr,nc,"normal");edge(cur,next);cur=next}
   }
   S.players=Array.from({length:total},(_,i)=>({name:i<humans?"P"+(i+1):"CPU"+(i-humans+1),cpu:i>=humans,icon:Number(chosenIcons[i]??(i%Math.max(1,CFG.icons.length))),pos:startPos,history:[startPos],shells:0,goals:0,skip:0}));
   S.goal=S.dests[Math.floor(Math.random()*S.dests.length)].id;
   $("home").classList.add("hidden");$("game").classList.remove("hidden");
   render();center(false);
   let d=CFG.destinations[S.goal-1];await popup((d?.emoji||"🎯")+" 最初の目的地<br><b>"+(d?.name||"目的地")+"</b>",900);
   if(S.players[0]?.cpu)setTimeout(roll,400);
 }catch(err){
   console.error(err);alert("ゲーム開始エラー："+err.message);
 }finally{
   $("start").disabled=false;$("start").textContent="🎲 ゲームスタート！";
 }
}
