  for(let nxt of opts){
   let e=eid(cur,nxt),count=visitedEdges[e]||0;
   if(count>=1)continue;
   visitedEdges[e]=count+1;route.push(nxt);
   let hit=dfs(nxt,left-1,cur,route,visitedEdges);
   route.pop();if(count)visitedEdges[e]=count;else delete visitedEdges[e];
   if(hit?.exact)return hit;
  }
  return null;
 }
 let exact=dfs(start,steps,blockedPrev,[start],{});
 return exact||best;
}
