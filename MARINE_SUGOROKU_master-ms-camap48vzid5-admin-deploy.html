<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>🎲 MARINE SUGOROKU MASTER</title><style>
*{box-sizing:border-box} :root{--a:#1686c9;--a2:#0878bd;--line:#9bd6f4;--panel:rgba(255,255,255,.94);--soft:#eef9ff}
body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}
body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.35);z-index:-1}
main{max-width:1080px;margin:auto;padding:14px}h1{color:var(--a2)}h2{margin-top:4px}
.box,.item{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:14px;margin:11px 0;backdrop-filter:blur(5px)}
.item{border-width:1px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}
input,textarea,select{width:100%;padding:9px;margin:4px 0;border:1px solid var(--line);border-radius:8px;background:white}textarea{min-height:72px;resize:vertical}
button,.filebtn{display:inline-block;border:0;border-radius:9px;padding:9px 11px;margin:3px;background:var(--a);color:white;font-weight:800;cursor:pointer}
button:active,.filebtn:active{transform:translateY(1px)}.danger{background:#b94b4b}.secondary{background:#607d8b}.good{background:#278a62}
.small{font-size:11px;color:#567;line-height:1.6}.status{font-size:12px;font-weight:800;color:#176a4d}.top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.top b{flex:1}
.thumb{width:90px;height:90px;object-fit:contain;background:var(--soft);border-radius:12px}.hidden{display:none!important}
#lock{position:fixed;inset:0;z-index:9999;background:linear-gradient(160deg,#dff4ff,#8bd2f5);display:flex;align-items:center;justify-content:center;padding:20px}
#lock>div{width:min(430px,100%);background:#fff;border:2px solid #79c8ef;border-radius:22px;padding:22px;box-shadow:0 18px 55px #1678a533}
details{border-top:1px solid #def;padding-top:8px;margin-top:8px}summary{cursor:pointer;font-weight:800}
</style></head><body>
<div id="lock"><div><h2>🔐 🎲 MARINE SUGOROKU MASTER</h2><div class="small">管理パスワードを入力してください。</div><input id="pw" type="password" inputmode="numeric"><button id="loginBtn">管理画面を開く</button><div id="loginMsg" class="small"></div></div></div>
<main id="app" class="hidden"><h1>🎲 MARINE SUGOROKU MASTER</h1><div class="small">マス・イベント・画像・参照問題を簡単編集できる原案MASTER <span id="status" class="status"></span></div>
<div class="box"><h2>🌊 ホーム背景同期</h2><div class="small">同じ場所の marine-theme.json を自動読込。必要なら手動でも読み込めます。</div><label class="filebtn">marine-theme.json を選択<input id="themeFile" type="file" accept=".json" hidden></label><div id="themeMsg" class="small"></div></div>

<div class="box"><h2>💾 保存・バックアップ</h2><button id="saveNow" class="good">今すぐ保存</button><button id="backup">MASTERバックアップ</button><label class="filebtn">バックアップ読込<input id="restore" type="file" accept=".json" hidden></label></div>
<div class="box"><h2>🎲 ボード設定</h2><div class="row"><label>タイトル<input id="title"></label><label>推奨人数<input id="players" value="1〜4人"></label></div><label>説明<textarea id="desc"></textarea></label><label>ボード背景画像<input id="boardImg" type="file" accept="image/*"></label><div id="boardPreview"></div></div>
<div class="box"><h2>🟦 マス編集</h2><div class="small">マスは追加・削除・順番変更可能。通常、進む、戻る、休み、クイズ、イベントなどを自由に設定できます。</div><div id="spaces"></div><button id="add">＋ マス追加</button></div>
<div class="box"><h2>📦 実装用書き出し</h2><div class="small">公開用 index.html はサイコロ、現在位置、マス効果、途中保存・再開に対応。</div><button id="export">sugoroku-data.json</button><button id="exportIndex" class="good">公開用 index.html を書き出す</button></div>
</main><script>const $=id=>document.getElementById(id);
const STORAGE="marine_sugoroku_master_v1",THEMEKEY="marine_theme_cache_v1";
let data={title:"MARINE SUGOROKU",players:"1〜4人",desc:"",boardImage:"",spaces:[]},timer;function state(){data.title=$("title").value;data.players=$("players").value;data.desc=$("desc").value;return{schema:"marine-sugoroku-master-v1",updated:new Date().toISOString(),...data}}
function save(show=false){try{localStorage.setItem(STORAGE,JSON.stringify(state()));if(show)$("status").textContent="保存しました ✓"}catch(e){alert("保存容量を超えた可能性があります")}}function autos(){clearTimeout(timer);timer=setTimeout(()=>save(),300)}
function load(){try{let x=JSON.parse(localStorage.getItem(STORAGE)||"null");if(x)data=x}catch(e){};$("title").value=data.title||"";$("players").value=data.players||"";$("desc").value=data.desc||"";render()}
function render(){$("boardPreview").innerHTML=data.boardImage?`<img src="${data.boardImage}" style="max-width:100%;max-height:260px;border-radius:14px">`:"";$("spaces").innerHTML="";data.spaces.forEach((s,i)=>{let d=document.createElement("div");d.className="item";d.innerHTML=`<div class="top">${s.image?`<img class="thumb" src="${s.image}">`:""}<b>${i+1}マス：${esc(s.label||s.type)}</b><button data-up="${i}">↑</button><button data-down="${i}">↓</button><button class="danger" data-del="${i}">削除</button></div><div class="row"><label>種類<select data-i="${i}" data-k="type">${["通常","進む","戻る","1回休み","もう1回","クイズ","謎解き","イベント","ゴール"].map(v=>`<option ${s.type==v?"selected":""}>${v}</option>`).join("")}</select></label><label>表示名<input data-i="${i}" data-k="label" value="${esc(s.label)}"></label><label>移動数<input type="number" data-i="${i}" data-k="move" value="${s.move||0}"></label></div><label>内容・指示<textarea data-i="${i}" data-k="text">${esc(s.text)}</textarea></label><label>参照ID（クイズ/謎解き等）<input data-i="${i}" data-k="refId" value="${esc(s.refId)}"></label><label>マス画像<input type="file" accept="image/*" data-img="${i}"></label>`;$("spaces").appendChild(d)})}
$("spaces").oninput=e=>{if(e.target.dataset.i!==undefined){let k=e.target.dataset.k,v=e.target.value;data.spaces[+e.target.dataset.i][k]=k=="move"?+v:v;autos()}}
$("spaces").onchange=e=>{if(e.target.dataset.img!==undefined)readImg(e.target.files[0],s=>{data.spaces[+e.target.dataset.img].image=s;render();save()})}
$("spaces").onclick=e=>{let i;if(e.target.dataset.up!==undefined){i=+e.target.dataset.up;if(i>0)[data.spaces[i-1],data.spaces[i]]=[data.spaces[i],data.spaces[i-1]];render();autos()}if(e.target.dataset.down!==undefined){i=+e.target.dataset.down;if(i<data.spaces.length-1)[data.spaces[i+1],data.spaces[i]]=[data.spaces[i],data.spaces[i+1]];render();autos()}if(e.target.dataset.del!==undefined&&confirm("このマスを削除しますか？")){data.spaces.splice(+e.target.dataset.del,1);render();autos()}}
$("add").onclick=()=>{data.spaces.push({id:uid("space"),type:"通常",label:"",move:0,text:"",refId:"",image:""});render();autos()};for(let id of ["title","players","desc"])$(id).oninput=autos;
$("boardImg").onchange=e=>readImg(e.target.files[0],s=>{data.boardImage=s;render();save()});$("saveNow").onclick=()=>save(true);$("backup").onclick=()=>dl("marine-sugoroku-master-backup.json",JSON.stringify(state(),null,2));$("export").onclick=()=>dl("sugoroku-data.json",JSON.stringify(state(),null,2));$("restore").onchange=e=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save();load()}catch(_){alert("読込失敗")}};r.readAsText(e.target.files[0])}


function publicThemeScript(){
return `<script>
(function(){
 const THEMEKEY="marine_theme_cache_v1";
 function find(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
 function apply(t){let im=find(t);if(im)document.body.style.backgroundImage='url("'+im.replace(/"/g,"%22")+'")'}
 fetch("marine-theme.json",{cache:"no-store"}).then(r=>r.ok?r.json():Promise.reject()).then(t=>{try{localStorage.setItem(THEMEKEY,JSON.stringify(t))}catch(e){};apply(t)}).catch(()=>{try{let s=localStorage.getItem(THEMEKEY);if(s)apply(JSON.parse(s))}catch(e){}})
})();<\/script>`;
}
function publicCss(){
return `*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#eaf7ff center/cover fixed no-repeat;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#123}body:before{content:"";position:fixed;inset:0;background:rgba(234,247,255,.42);z-index:-1}.wrap{max-width:850px;margin:auto;padding:18px}.card{background:rgba(255,255,255,.94);border:2px solid #9bd6f4;border-radius:20px;padding:18px;margin:12px 0;backdrop-filter:blur(6px)}h1{color:#0878bd;margin-bottom:8px}button{border:0;border-radius:11px;padding:11px 14px;margin:5px;background:#1686c9;color:white;font-weight:800;cursor:pointer}.muted{color:#567;font-size:12px}.choice{display:block;width:100%;text-align:left}.good{background:#278a62}.bad{background:#b94b4b}.img{max-width:100%;max-height:300px;object-fit:contain;border-radius:14px}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.bar>*{flex:1}.hidden{display:none!important}`;
}

function makeSugorokuIndex(){
 const d=state(),payload=JSON.stringify(d).replace(/</g,"\\u003c");
 return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(d.title||"MARINE SUGOROKU")}</title><style>${publicCss()} .board{display:flex;gap:8px;flex-wrap:wrap}.sq{width:88px;min-height:88px;border:2px solid #9bd6f4;border-radius:14px;padding:7px;background:#fff}.here{outline:4px solid #1686c9}.sq img{width:100%;height:42px;object-fit:contain}</style></head><body><div class="wrap"><div class="card"><h1 id="title"></h1><p id="desc"></p><div id="boardimg"></div></div><div class="card"><div id="board" class="board"></div></div><div class="card"><h2 id="pos"></h2><p id="event"></p><button id="dice">サイコロを振る</button><button id="reset">最初から</button><span id="saved" class="muted"></span></div></div>${publicThemeScript()}<script>
const DATA=${payload},SAVE="marine_sugoroku_public_save_v1";const $=x=>document.getElementById(x),E=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));let p=0,turn=0;
function load(){try{let z=JSON.parse(localStorage.getItem(SAVE)||"null");if(z){p=z.p||0;turn=z.turn||0}}catch(e){}}
function save(){localStorage.setItem(SAVE,JSON.stringify({p,turn}));$("saved").textContent="進行状況を保存済み"}
function draw(){ $("title").textContent=DATA.title||"MARINE SUGOROKU";$("desc").textContent=DATA.desc||"";$("boardimg").innerHTML=DATA.boardImage?'<img class="img" src="'+DATA.boardImage+'">':"";
$("board").innerHTML=DATA.spaces.map((s,i)=>'<div class="sq '+(i==p?"here":"")+'">'+(s.image?'<img src="'+s.image+'">':"")+'<b>'+(i+1)+'</b><br>'+E(s.label||s.type)+'</div>').join("");$("pos").textContent=DATA.spaces.length?"現在 "+(p+1)+"マス目":"マスが登録されていません"}
function land(){let s=DATA.spaces[p];if(!s)return;$("event").textContent=s.text||s.type||"";if(s.type==="進む"||s.type==="戻る"){let m=Number(s.move)||0;p=Math.max(0,Math.min(DATA.spaces.length-1,p+m));$("event").textContent+=(m>=0?" ＋":" ")+m+"マス";}if(s.type==="ゴール")$("dice").disabled=true;save();draw()}
$("dice").onclick=()=>{if(!DATA.spaces.length)return;let n=1+Math.floor(Math.random()*6);turn++;p=Math.min(DATA.spaces.length-1,p+n);$("event").textContent=n+" が出た！";draw();setTimeout(land,250)};$("reset").onclick=()=>{if(confirm("最初から始めますか？")){p=0;turn=0;$("dice").disabled=false;localStorage.removeItem(SAVE);$("event").textContent="";draw();save()}};load();draw();
<\/script></body></html>`;
}
$("exportIndex").onclick=()=>dl("index.html",makeSugorokuIndex(),"text/html;charset=utf-8");

const PW="3103";
function dl(n,t,type="application/json;charset=utf-8"){let b=new Blob([t],{type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(p){return p+"_"+Date.now().toString(36)+"_"+Math.random().toString(36).slice(2,7)}
function readImg(file,cb){if(!file)return;let r=new FileReader();r.onload=()=>cb(r.result);r.readAsDataURL(file)}
function themeImage(o){let st=[o],seen=new Set();while(st.length){let x=st.pop();if(!x||typeof x!=="object"||seen.has(x))continue;seen.add(x);for(let [k,v] of Object.entries(x)){if(typeof v==="string"&&/background|image|bg/i.test(k)&&(v.startsWith("data:image/")||v.startsWith("http")||v.startsWith("./")||v.startsWith("../")))return v;if(v&&typeof v==="object")st.push(v)}}return""}
function applyTheme(t){let im=themeImage(t);if(im)document.body.style.backgroundImage=`url("${im.replace(/"/g,"%22")}")`;$("themeMsg").textContent=im?"ホーム背景を反映しました ✓":"背景画像が見つかりませんでした"}
async function autoTheme(){try{let r=await fetch("marine-theme.json",{cache:"no-store"});if(r.ok){let t=await r.json();localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t);return}}catch(e){}try{let s=localStorage.getItem(THEMEKEY);if(s)applyTheme(JSON.parse(s))}catch(e){}}
$("themeFile").onchange=e=>{let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let t=JSON.parse(r.result);localStorage.setItem(THEMEKEY,JSON.stringify(t));applyTheme(t)}catch(e){alert("marine-theme.jsonを読み込めませんでした")}};r.readAsText(f);e.target.value=""}
$("loginBtn").onclick=unlock;$("pw").onkeydown=e=>{if(e.key==="Enter")unlock()};
function unlock(){if($("pw").value===PW){$("lock").classList.add("hidden");$("app").classList.remove("hidden");sessionStorage.setItem(STORAGE+"_login","1");load();autoTheme()}else $("loginMsg").textContent="パスワードが違います"}
if(sessionStorage.getItem(STORAGE+"_login")==="1"){$("lock").classList.add("hidden");$("app").classList.remove("hidden");load();autoTheme()}
</script></body></html>
